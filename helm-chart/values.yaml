# Build with `make docker`, or supply an image from your registry.
image:
  repository: bandwidth-quota
  tag: dev
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""
replicaCount: 2

service:
  type: ClusterIP
  port: 9300

podAnnotations: {}
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: 7.4-alpine
    pullPolicy: IfNotPresent
  port: 6379
  persistence:
    # false uses emptyDir; true enables AOF on a persistent volume.
    enabled: false
    size: 1Gi
    # "" uses the cluster default StorageClass; "-" requests no StorageClass.
    storageClass: ""
    # Reuse a claim in the release namespace instead of creating one.
    existingClaim: ""
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

externalRedis:
  # Required when redis.enabled=false. The service currently supports plain
  # host:port connections only, without Redis authentication or TLS.
  address: ""
